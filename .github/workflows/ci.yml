name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. TypeScript ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ── 2. Library build ─────────────────────────────────────────────────────────
  build:
    name: Library build (tsup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Upload dist artefact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: packages/ds-patternfly/dist/
          retention-days: 7

  # ── 3. Storybook build ───────────────────────────────────────────────────────
  storybook-build:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook

  # ── 4. Storybook tests (Vitest + Playwright Chromium) ────────────────────────
  storybook-tests:
    name: Storybook interaction + a11y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Playwright browsers are downloaded to ~/.cache/ms-playwright.
      # Cache the whole directory keyed on the lockfile so we only re-download
      # when the resolved Playwright version changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Install only the Chromium browser binary — NOT `--with-deps`. The
      # GitHub ubuntu-latest runner image already ships Chromium's OS
      # libraries (Chrome/Chromium/Edge/Firefox are preinstalled), so the
      # apt-get that `--with-deps` runs is unnecessary and was hanging the
      # job indefinitely on needrestart's interactive "restart services?"
      # prompt. On a cache hit the browser is already present, so skip.
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @golden-passport/ds-patternfly exec playwright install chromium

      - run: pnpm test
